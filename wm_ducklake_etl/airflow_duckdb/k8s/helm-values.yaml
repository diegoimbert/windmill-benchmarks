# Values for the official Apache Airflow Helm chart
# https://github.com/apache/airflow-helm-chart
# Chart: apache-airflow/airflow

executor: KubernetesExecutor

images:
  airflow:
    repository: ghcr.io/windmill-labs/airflow-duckdb-bench
    tag: latest
    pullPolicy: Always

config:
  core:
    load_examples: "False"
    dags_are_paused_at_creation: "False"
  kubernetes_executor:
    delete_worker_pods: "True"
    delete_worker_pods_on_failure: "False"

env:
  - name: S3_ENDPOINT
    value: "minio.default.svc.cluster.local:9000"
  - name: S3_ACCESS_KEY
    value: "minioadmin"
  - name: S3_SECRET_KEY
    value: "minioadmin"
  - name: S3_REGION
    value: "us-east-1"
  - name: DUCKDB_PATH
    value: "/tmp/tpcds_bench.duckdb"

workers:
  resources:
    limits:
      cpu: "8"
      memory: 32Gi
    requests:
      cpu: "4"
      memory: 16Gi
  nodeSelector:
    benchmark: "true"

# KubernetesExecutor pod template overrides
kubernetes:
  resources:
    limits:
      cpu: "8"
      memory: 32Gi
    requests:
      cpu: "4"
      memory: 16Gi
  nodeSelector:
    benchmark: "true"

scheduler:
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: "1"
      memory: 2Gi

webserver:
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "500m"
      memory: 1Gi
  service:
    type: ClusterIP
    ports:
      - port: 8080

postgresql:
  enabled: true
  auth:
    postgresPassword: airflow
    database: airflow

redis:
  enabled: false

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false
