# Airflow Helm chart values for TPC-DS SF10 Pandas benchmark (AWS EKS)
# Chart: https://airflow.apache.org/docs/helm-chart/stable/index.html

executor: KubernetesExecutor

defaultAirflowRepository: 255399219127.dkr.ecr.us-east-1.amazonaws.com/ducklake-bench/airflow-pandas
defaultAirflowTag: latest

images:
  airflow:
    repository: 255399219127.dkr.ecr.us-east-1.amazonaws.com/ducklake-bench/airflow-pandas
    tag: latest
    pullPolicy: Always

airflowVersion: "2.10.5"

config:
  core:
    dags_are_paused_at_creation: "true"
    load_examples: "false"
  kubernetes_executor:
    delete_worker_pods: "true"
    delete_worker_pods_on_failure: "false"

env:
  - name: S3_BUCKET
    value: "ducklake-bench-data"
  - name: S3_PREFIX
    value: "tpcds/sf10"
  - name: DATA_DIR
    value: "/opt/airflow/data"
  - name: AWS_DEFAULT_REGION
    value: "us-east-1"

extraEnv: |
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: aws-credentials
        key: access-key
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: aws-credentials
        key: secret-key

webserver:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  service:
    type: ClusterIP

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

workers:
  replicas: 0

triggerer:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

postgresql:
  enabled: false

data:
  metadataConnection:
    user: airflow
    pass: airflow
    protocol: postgresql
    host: airflow-postgres
    port: 5432
    db: airflow

redis:
  enabled: false

flower:
  enabled: false

migrateDatabaseJob:
  enabled: false

