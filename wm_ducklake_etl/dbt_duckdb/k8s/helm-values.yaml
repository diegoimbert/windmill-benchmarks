apiVersion: batch/v1
kind: Job
metadata:
  name: dbt-tpcds-benchmark
  labels:
    app: dbt-tpcds-benchmark
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: dbt-tpcds-benchmark
    spec:
      restartPolicy: Never
      containers:
        - name: dbt
          image: dbt-tpcds-benchmark:latest
          command: ["dbt", "run", "--threads", "8", "--profiles-dir", "/dbt"]
          env:
            - name: S3_ENDPOINT
              value: "minio.default.svc.cluster.local:9000"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-access-key
            - name: S3_REGION
              value: "us-east-1"
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: dbt-data
              mountPath: /data
      volumes:
        - name: dbt-data
          emptyDir:
            sizeLimit: 50Gi
