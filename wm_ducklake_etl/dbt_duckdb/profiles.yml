tpcds_benchmark:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /data/tpcds_benchmark.duckdb
      threads: 8
      settings:
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'minio:9000') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY_ID', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_ACCESS_KEY', 'minioadmin') }}"
        s3_region: "{{ env_var('S3_REGION', 'us-east-1') }}"
        s3_url_style: path
        s3_use_ssl: false
