# Airflow Helm chart values for TPC-DS ETL benchmark (Snowflake compute, AWS EKS)
# Install: helm install airflow-snowflake apache-airflow/airflow --version 1.16.0 -f helm-values.yaml -n bench

defaultAirflowRepository: 255399219127.dkr.ecr.us-east-1.amazonaws.com/ducklake-bench/airflow-snowflake
defaultAirflowTag: latest

images:
  airflow:
    repository: 255399219127.dkr.ecr.us-east-1.amazonaws.com/ducklake-bench/airflow-snowflake
    tag: latest
    pullPolicy: Always

airflowVersion: "2.10.5"

executor: CeleryExecutor

config:
  core:
    dags_are_paused_at_creation: "true"
    load_examples: "false"
  celery:
    worker_concurrency: "16"

extraEnv: |
  - name: SNOWFLAKE_ACCOUNT
    valueFrom:
      secretKeyRef:
        name: snowflake-credentials
        key: account
  - name: SNOWFLAKE_USER
    valueFrom:
      secretKeyRef:
        name: snowflake-credentials
        key: user
  - name: SNOWFLAKE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: snowflake-credentials
        key: password
  - name: SNOWFLAKE_DATABASE
    valueFrom:
      secretKeyRef:
        name: snowflake-credentials
        key: database
  - name: SNOWFLAKE_SCHEMA
    valueFrom:
      secretKeyRef:
        name: snowflake-credentials
        key: schema
  - name: SNOWFLAKE_WAREHOUSE
    valueFrom:
      secretKeyRef:
        name: snowflake-credentials
        key: warehouse
  - name: SNOWFLAKE_ROLE
    valueFrom:
      secretKeyRef:
        name: snowflake-credentials
        key: role

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

workers:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 16Gi

scheduler:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

webserver:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

triggerer:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "500m"
      memory: 512Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 512Mi

postgresql:
  enabled: false

data:
  metadataConnection:
    user: airflow_sf
    pass: airflow_sf
    protocol: postgresql
    host: airflow-postgres
    port: 5432
    db: airflow_sf

flower:
  enabled: false

migrateDatabaseJob:
  enabled: true
